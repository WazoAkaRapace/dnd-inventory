# Production docker-compose using pre-built images from GHCR.
# Usage:
#   1. Copy .env.example to .env and set JWT_SECRET
#   2. docker compose -f docker-compose.prod.yml up -d
#
services:
  api:
    image: ghcr.io/wazoakarapace/dnd-inventory-api:latest
    ports:
      - "${API_PORT:-4010}:4000"
    volumes:
      - db-data:/app/data/db
    environment:
      - PORT=4000
      - DATABASE_PATH=/app/data/db/inventory.sqlite
      # JWT_SECRET must be set — read from .env or shell environment
      - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped

  web:
    image: ghcr.io/wazoakarapace/dnd-inventory-web:latest
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
