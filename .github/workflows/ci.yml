name: Build & Push Docker Images

on:
  push:
    branches: [main]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ---------- Security scan ----------
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check for secrets in tracked files
        run: |
          echo "Scanning for potential secrets..."
          # Check for common secret patterns in tracked files (excluding lock files and deps)
          if grep -rnE "(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36}|-----BEGIN (RSA |EC )?PRIVATE KEY-----)" \
            --include='*.ts' --include='*.tsx' --include='*.json' --include='*.yml' --include='*.yaml' --include='*.sh' \
            --exclude-dir=node_modules --exclude-dir=dist --exclude='package-lock.json' .; then
            echo "❌ Potential secret found!"
            exit 1
          fi
          echo "✅ No secrets detected"

      - name: Check .env files are not tracked
        run: |
          if git ls-files | grep -E "^\.env$|\.env\.(local|production|staging)"; then
            echo "❌ A .env file is tracked in git!"
            exit 1
          fi
          echo "✅ No .env files tracked"

  # ---------- Build & Push API ----------
  build-api:
    needs: security-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- Build & Push Web ----------
  build-web:
    needs: security-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=

  # ---------- Update docker-compose for published images ----------
  publish-compose:
    needs: [build-api, build-web]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create production docker-compose
        run: |
          cat > docker-compose.prod.yml << 'EOF'
          # Production docker-compose using pre-built images from GHCR
          # Usage: docker compose -f docker-compose.prod.yml up -d
          services:
            api:
              image: ghcr.io/${{ github.repository }}-api:main
              ports:
                - "${API_PORT:-4010}:4000"
              volumes:
                - db-data:/app/data/db
              environment:
                - PORT=4000
                - DATABASE_PATH=/app/data/db/inventory.sqlite
                - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env or environment}
              restart: unless-stopped

            web:
              image: ghcr.io/${{ github.repository }}-web:main
              ports:
                - "${WEB_PORT:-8080}:80"
              depends_on:
                - api
              restart: unless-stopped

          volumes:
            db-data:
          EOF

      - name: Commit production compose file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docker-compose.prod.yml
          git commit -m "ci: update production docker-compose [skip ci]" || echo "No changes to commit"
          git push
